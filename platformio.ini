[platformio]
default_envs = c6

[env]
platform = espressif32
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
monitor_speed = 115200

[env:esp32dev]
board = esp32dev

[env:c3]
board = esp32-c3-devkitm-1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:c6]
; Waveshare ESP32-C6-Pico is not yet a first-class PlatformIO board (see
; platformio/platform-espressif32#1717). esp32-c6-devkitm-1 is the closest
; match: ESP32-C6, 4 MB flash, matches the board's flash capacity and MCU.
board = esp32-c6-devkitm-1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
